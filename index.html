<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#aeb9bd" />
    <title>비올까? ☂️</title>
    <link rel="apple-touch-icon" sizes="180x180" href="image/icon.png" />

    <link rel="icon" type="image/png" sizes="32x32" href="image/icon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="image/icon.png" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <main class="weather-app">
      <div class="weather-hero" id="weather-hero">
        <div class="box__visual">
          <button type="button" class="location-button" id="location-button">
            <span aria-hidden="true">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                class="icon"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99"
                />
              </svg>
            </span>
            <span id="location-text">내 위치 찾기</span>
          </button>
          <div class="box_village-wrap">
            <img src="image/village_basic.png" alt="" class="image_village" />
            <img src="image/whale_basic.png" alt="" class="image_whale" />
            <img src="image/cloud_basic.png" alt="" class="image_cloud1 image_cloud" />
            <img src="image/cloud2_basic.png" alt="" class="image_cloud2 image_cloud" />
            <img src="image/colud3_basic.png" alt="" class="image_colud3 image_cloud" />
            <img src="image/bubble.png" alt="" class="image_bubble image_bubble1" />
            <img src="image/bubble.png" alt="" class="image_bubble image_bubble2" />
            <img src="image/bubble.png" alt="" class="image_bubble image_bubble3" />
            <img src="image/moon_basic.png" alt="" class="image_moon" />
            <img src="image/planet_basic.png" alt="" class="image_planet" />
            <img src="image/planet2_basic.png" alt="" class="image_planet2" />
            <img src="image/star_basic.png" alt="" class="image_star image_star1" />
            <img src="image/star_basic.png" alt="" class="image_star image_star2" />
            <img src="image/raindrop2.png" alt="" class="image_raindrop image_raindrop1" />
            <img src="image/raindrop2.png" alt="" class="image_raindrop image_raindrop2" />
            <img src="image/cloud-fog.png" alt="" class="image_fog image_fog-back" />
            <img src="image/cloud-fog.png" alt="" class="image_fog image_fog-front" />
          </div>
        </div>
        <div class="rain-drops" id="rain-drops"></div>

        <div class="weather-message">
          <p class="weather-status" id="weather-status">날씨를 보러 갈까요?</p>
          <p class="weather-description" id="weather-description">
            현재 위치를 알려주면 앞으로 비가 언제 오고 그치는지 찾아볼게요.
          </p>
        </div>
      </div>

      <div class="box_weather">
        <div class="box_summary-wrap">
          <section class="rain-summary" aria-label="강수 요약">
            <div class="summary-item">
              <span class="summary-label">비 시작</span>
              <strong class="summary-value" id="rain-start">-</strong>
            </div>
            <div class="summary-divider" aria-hidden="true"></div>
            <div class="summary-item">
              <span class="summary-label">비 그침</span>
              <strong class="summary-value" id="rain-end">-</strong>
            </div>
            <div class="summary-divider" aria-hidden="true"></div>
            <div class="summary-item">
              <span class="summary-label">우산</span>
              <strong class="summary-value" id="umbrella-status">기다리는 중</strong>
            </div>
          </section>
        </div>
        <section class="timeline-section">
          <div class="section-heading">
            <p>구름을 옆으로 슥슥 밀어보세요 ☁️</p>
            <span class="timeline-range">앞으로 12시간</span>
          </div>
          <div class="timeline" id="timeline" tabindex="0" aria-label="시간별 날씨 예보">
            <div class="timeline-loading">
              <span class="loading-cloud">☁️</span>
              <span>위치를 찾으면 구름이 나타나요</span>
            </div>
          </div>
          <p class="weather-note" id="weather-note">
            기상청 단기예보 조회서비스를 사용해요. 실제 강수 시각은 지역과 관측 상황에 따라 달라질 수 있어요.
          </p>
        </section>
      </div>

      <section class="dev-guide" id="dev-guide">
        <div class="dev-guide__buttons" role="group">
          <span class="dev-guide__badge">DEV</span>
          <button type="button" class="dev-guide__button is-active" data-weather-mode="api">실제 API</button>
          <button type="button" class="dev-guide__button" data-weather-mode="sunny">☀️ 맑음</button>
          <button type="button" class="dev-guide__button" data-weather-mode="cloudy">☁️ 흐림</button>
          <button type="button" class="dev-guide__button" data-weather-mode="rain">🌧️ 비</button>
          <button type="button" class="dev-guide__button" data-weather-mode="snow">❄️ 눈</button>
        </div>
      </section>
    </main>
    <script src="./utils/weather.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
